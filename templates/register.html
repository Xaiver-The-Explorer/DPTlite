{% extends "layout.html" %}
{% block title %}Register &mdash; DPTlite{% endblock %}

{% block content %}
<section class="auth-page">
  <form class="auth-card" method="post" action="{{ url_for('register') }}" autocomplete="off">
    <h1>Create your account</h1>
    <p class="muted">Registration unlocks the analysis tool, your history, and bookmarking.</p>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required maxlength="80" placeholder="Ada Lovelace">

    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required maxlength="120" placeholder="ada@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">

    <label for="confirmation">Confirm password</label>
    <input type="password" id="confirmation" name="confirmation" required minlength="6" placeholder="Type it again">

    <label class="checkbox-row">
      <input type="checkbox" id="show-passwords"> Show passwords
    </label>

    <button type="submit" class="btn-solid btn-full">Register</button>

    <p class="auth-footnote">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
  // A small convenience toggle -- the fields still default to masked (type="password"), which is what actually hides the characters.
  document.getElementById("show-passwords").addEventListener("change", (e) => {
    const type = e.target.checked ? "text" : "password";
    document.getElementById("password").type = type;
    document.getElementById("confirmation").type = type;
  });
</script>
{% endblock %}
